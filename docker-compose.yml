services:
  nametagger:
    # Published by .github/workflows/docker.yml on every push to main.
    # `docker compose pull` fetches it; `docker compose up --build` builds locally instead.
    image: ghcr.io/walhil/nametagger:latest
    build: .
    container_name: nametagger
    restart: unless-stopped
    env_file: .env
    environment:
      GSHEETS_TOKEN_FILE: /app/data/token.json
    volumes:
      # token.json lives here; the bot rewrites it when the access token refreshes
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
